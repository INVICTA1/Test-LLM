name: Validate SWE-bench Data Points

on:
  push:
    paths:
      - 'task-release-2025-07-29-115124/data_points/**/*.json'
  pull_request:
    paths:
      - 'task-release-2025-07-29-115124/data_points/**/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'data_points/.*\.json$' | xargs -I{} basename {} .json || true)
          else
            FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} | grep 'data_points/.*\.json$' | xargs -I{} basename {} .json || true)
          fi
          
          if [ -z "$FILES" ]; then
            echo "No data point files changed"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Convert to --instance-id arguments
          INSTANCES=""
          for f in $FILES; do
            INSTANCES="$INSTANCES --instance-id $f"
          done
          
          echo "instances=$INSTANCES" >> $GITHUB_OUTPUT
          echo "count=$(echo $FILES | wc -w)" >> $GITHUB_OUTPUT
          echo "Changed instances: $INSTANCES"
      
      - name: Setup Python
        if: steps.changed.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        if: steps.changed.outputs.count != '0'
        working-directory: task-release-2025-07-29-115124
        run: |
          pip install uv
          uv venv
          uv pip install -e .
      
      - name: Run enhanced validation
        id: run-validation
        if: steps.changed.outputs.count != '0'
        working-directory: task-release-2025-07-29-115124
        continue-on-error: true
        run: |
          source .venv/bin/activate
          echo "🔍 Running enhanced validation on ${{ steps.changed.outputs.count }} data point(s): ${{ steps.changed.outputs.instances }}"
          # Run validation and capture output
          python -m swe_bench_validator data_points ${{ steps.changed.outputs.instances }} --max-workers 2 --timeout 1800 --verbose --model-name gold > validation_output.log 2>&1
          validation_exit_code=$?
          
          # Always capture output for PR comments
          echo "validation_output<<EOF" >> $GITHUB_OUTPUT
          cat validation_output.log >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Set validation status for later use
          echo "validation_success=$([ $validation_exit_code -eq 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          
          # Don't exit here - let the job continue to create PR comments
      
      - name: Check validation status
        if: steps.changed.outputs.count != '0'
        continue-on-error: true
        run: |
          if [ "${{ steps.run-validation.outputs.validation_success }}" != "true" ]; then
            echo "❌ Validation failed - blocking merge"
            exit 1
          else
            echo "✅ Validation passed - allowing merge"
          fi
      
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const status = '${{ job.status }}';
            const instances = '${{ steps.changed.outputs.instances }}';
            const count = '${{ steps.changed.outputs.count }}';
            // Prefer reading the log file directly to avoid output size truncation
            const logPath = path.join(process.cwd(), 'task-release-2025-07-29-115124', 'validation_output.log');
            let validationOutput = '';
            try {
              let content = fs.readFileSync(logPath, 'utf8');
              // Limit to last ~60k chars to fit GitHub comment limits
              const MAX_LEN = 60000;
              if (content.length > MAX_LEN) {
                content = content.slice(-MAX_LEN);
                content = '... (truncated) ...\n' + content;
              }
              validationOutput = content;
            } catch (e) {
              // Fallback to step output if reading file fails
              validationOutput = `${{ steps.run-validation.outputs.validation_output }}`;
            }
            const validationSuccess = '${{ steps.run-validation.outputs.validation_success }}' === 'true';
            
            let comment = `# 🔍 Enhanced SWE-bench Validation Report\n\n`;
            comment += `**Validated:** ${count} data point(s)\n`;
            comment += `**Instances:** ${instances}\n`;
            comment += `**Architecture:** Modular with comprehensive validation\n\n`;
            
            // Use the actual validation success status
            const validationPassed = validationSuccess;
            
            if (validationPassed) {
              comment += `## ✅ All Validations Passed\n\n`;
              comment += `🎉 **Success!** Enhanced validation completed successfully:\n`;
              comment += `- ✅ **Data Structure**: All required fields validated\n`;
              comment += `- ✅ **Patches**: Apply correctly to codebase\n`;
              comment += `- ✅ **Tests**: FAIL_TO_PASS tests now pass\n`;
              comment += `- ✅ **Regression**: PASS_TO_PASS tests continue to pass\n`;
              comment += `- ✅ **Infrastructure**: No Docker or execution errors\n`;
              comment += `- ✅ **Statistics**: Comprehensive reporting available\n\n`;
              comment += `### 📋 Enhanced Validation Details\n`;
              comment += `\`\`\`\n${validationOutput}\n\`\`\``;
            } else {
              comment += `## ❌ Enhanced Validation Failed\n\n`;
              comment += `🚨 **Validation failed!** Enhanced validation detected issues:\n\n`;
              comment += `### 📋 Detailed Error Analysis\n`;
              comment += `\`\`\`\n${validationOutput}\n\`\`\`\n\n`;
              comment += `### 🔍 Enhanced Error Categories:\n`;
              comment += `- ❌ **Data Structure**: Missing or invalid required fields\n`;
              comment += `- ❌ **Repository**: Unknown or unsupported repository\n`;
              comment += `- ❌ **Patch Format**: Invalid patch format or content\n`;
              comment += `- ❌ **Test Logic**: FAIL_TO_PASS tests still fail\n`;
              comment += `- ❌ **Regression**: PASS_TO_PASS tests now fail\n`;
              comment += `- ❌ **Infrastructure**: Docker build/execution errors\n`;
              comment += `- ❌ **Timeout**: Test execution exceeded time limit\n`;
              comment += `- ❌ **Validation**: Enhanced field validation failed\n`;
            }
            
            // Find existing validation comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('SWE-bench Validation Report')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Upload validation logs artifact
        if: always() && steps.changed.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: task-release-2025-07-29-115124/validation_output.log
          if-no-files-found: ignore

      - name: Add job summary
        if: always() && steps.changed.outputs.count != '0'
        run: |
          {
            echo "# 🔍 Enhanced SWE-bench Validation Report";
            echo "**Validated:** ${{ steps.changed.outputs.count }} data point(s)";
            echo "**Instances:** ${{ steps.changed.outputs.instances }}";
            echo "**Result:** $([ "${{ steps.run-validation.outputs.validation_success }}" = "true" ] && echo '✅ Passed' || echo '❌ Failed')";
            echo;
            echo "## Logs";
            echo "\n<details open><summary>Show full logs</summary>\n";
            echo '```';
            cat task-release-2025-07-29-115124/validation_output.log || true;
            echo '```';
            echo "\n</details>";
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail job if validation failed
        if: steps.changed.outputs.count != '0' && steps.run-validation.outputs.validation_success != 'true'
        run: exit 1

