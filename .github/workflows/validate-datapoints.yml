name: Validate SWE-bench Data Points

on:
  push:
    paths:
      - 'task-release-2025-07-29-115124/data_points/**/*.json'
  pull_request:
    paths:
      - 'task-release-2025-07-29-115124/data_points/**/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'data_points/.*\.json$' | xargs -I{} basename {} .json || true)
          else
            FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} | grep 'data_points/.*\.json$' | xargs -I{} basename {} .json || true)
          fi
          
          if [ -z "$FILES" ]; then
            echo "No data point files changed"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Convert to --instance-id arguments
          INSTANCES=""
          for f in $FILES; do
            INSTANCES="$INSTANCES --instance-id $f"
          done
          
          echo "instances=$INSTANCES" >> $GITHUB_OUTPUT
          echo "count=$(echo $FILES | wc -w)" >> $GITHUB_OUTPUT
          echo "Changed instances: $INSTANCES"
      
      - name: Setup Python
        if: steps.changed.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        if: steps.changed.outputs.count != '0'
        working-directory: task-release-2025-07-29-115124
        run: |
          pip install uv
          uv venv
          uv pip install -e .
      
      - name: Run validation
        if: steps.changed.outputs.count != '0'
        working-directory: task-release-2025-07-29-115124
        run: |
          source .venv/bin/activate
          echo "Validating ${{ steps.changed.outputs.count }} data point(s): ${{ steps.changed.outputs.instances }}"
          python -m swe_bench_validator data_points ${{ steps.changed.outputs.instances }} --max-workers 2 --timeout 1800 --verbose
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.changed.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}';
            const instances = '${{ steps.changed.outputs.instances }}';
            const count = '${{ steps.changed.outputs.count }}';
            
            let comment = `# 🔍 SWE-bench Validation Report\n\n`;
            comment += `**Validated:** ${count} data point(s)\n`;
            comment += `**Instances:** ${instances}\n\n`;
            
            if (status === 'success') {
              comment += `## ✅ All Validations Passed\n\n`;
              comment += `🎉 **Success!** All data points are valid:\n`;
              comment += `- ✅ Patches apply correctly\n`;
              comment += `- ✅ FAIL_TO_PASS tests now pass\n`;
              comment += `- ✅ PASS_TO_PASS tests continue to pass\n`;
              comment += `- ✅ No Docker or execution errors\n`;
            } else {
              comment += `## ❌ Validation Failed\n\n`;
              comment += `🚨 **Validation failed!** Possible issues:\n`;
              comment += `- ❌ Patch doesn't apply to codebase\n`;
              comment += `- ❌ FAIL_TO_PASS tests still fail\n`;
              comment += `- ❌ PASS_TO_PASS tests now fail (regression)\n`;
              comment += `- ❌ Docker build/execution errors\n`;
              comment += `- ❌ Test execution timeout\n`;
            }
            
            // Find existing validation comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('SWE-bench Validation Report')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

